# transform_params.yaml
# Default values — update after running calibration script

coord_transform:
  ros__parameters:
    object_offset_x: 0.05
    object_offset_y: 0.0
    object_offset_z: 0.10

    cam_to_base_qx: 0.0
    cam_to_base_qy: 0.0
    cam_to_base_qz: 0.0
    cam_to_base_qw: 1.0

    cam_to_base_tx: 0.5
    cam_to_base_ty: 0.0
    cam_to_base_tz: 1.2

    ee_orient_x: 0.0
    ee_orient_y: 1.0
    ee_orient_z: 0.0
    ee_orient_w: 0.0

    # Axis remap: camera workspace → robot base frame
    # Robot X+ = phải→trái (camera view), camera x_ws+ = trái→phải → cần negate
    # Robot Y+ = về phía camera, camera y_ws+ = về phía camera → cùng chiều
    # Robot Z+ = lên trên, camera z_ws+ = lên trên → cùng chiều
    axis_remap: [0, 1, 2]
    axis_sign: [-1.0, 1.0, 1.0]
    prediction_step: 5

    workspace_x_min: -1.0
    workspace_x_max:  1.0
    workspace_y_min: -0.5
    workspace_y_max:  1.3
    workspace_z_min:  0.05
    workspace_z_max:  1.5

    # ── Bộ lọc nhiễu (Filter Parameters) ──────────────────────────────────
    # Outlier rejection: ngưỡng nhảy tọa độ thô tối đa giữa 2 frame (m)
    # Điểm nhảy hơn mức này sẽ bị loại bỏ (tối đa 5 frame liên tiếp)
    filter.outlier_threshold: 0.15

    # Median filter size cho trục Y (Depth) — giá trị lẻ: 3, 5, 7
    # ↓ 3 thay vì 7: giảm trễ nhóm từ ~100ms xuống ~33ms, vẫn đủ khử gai
    filter.median_size_y: 3

    # Moving deadband: ngưỡng độ lệch chuẩn (Standard Deviation) lớn nhất trên 3 trục để kích hoạt hold (m)
    # Tăng lên 0.025 vì kiểm tra 3 trục trong suốt 15 frames, nhiễu tổng hợp sẽ lớn hơn.
    filter.deadband_depth_tol: 0.025

    # Số frame liên tiếp tĩnh để kích hoạt hold
    # Giảm xuống 3 để hold nhanh hơn
    filter.stationary_threshold: 3

    # Rate-limiter tọa độ đích cuối cùng (m) — bước nhảy tối đa mỗi frame
    filter.max_rate: 0.05

    # EMA alpha khi ĐANG DI CHUYỂN (0 = không theo, 1 = raw)
    # Đã tăng mạnh alpha để robot phản hồi gần như tức thời (giảm trễ).
    # Vì đã có cơ chế HOLD cực chặt khi tay dừng, ta không cần lọc quá mạnh lúc di chuyển nữa.
    filter.ema_x_moving: 0.65
    filter.ema_y_moving: 0.40
    filter.ema_z_moving: 0.65

    # EMA alpha khi ĐANG HOLD (lock vị trí)
    # Giữ càng thấp càng tốt để robot đứng yên hoàn toàn
    filter.ema_x_hold: 0.08
    filter.ema_y_hold: 0.02
    filter.ema_z_hold: 0.05
